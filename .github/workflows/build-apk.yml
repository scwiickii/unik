name: Build APK

# Запускается автоматически при пуше в main/master,
# а также вручную кнопкой "Run workflow" во вкладке Actions.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Официальный Docker-образ от команды Kivy — внутри уже стоит
      # buildozer, Android SDK/NDK и все системные зависимости в нужных
      # версиях. Это надёжнее сторонних action'ов, которые часто ломаются
      # при обновлении Ubuntu на раннерах GitHub.
      # Монтируем репозиторий внутрь контейнера как /home/user/hostcwd —
      # именно оттуда buildozer возьмёт main.py/buildozer.spec и туда же
      # положит готовый APK (в подпапку bin/).
      - name: Build APK in kivy/buildozer container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/home/user/hostcwd \
            kivy/buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uniqualizer-apk
          path: bin/*.apk
