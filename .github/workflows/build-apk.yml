name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev lldb lld bzip2 libbz2-dev \
            libffi-dev libssl-dev make xz-utils zlib1g-dev \
            autoconf automake libtool pkg-config patch \
            git textinfo unzip openjdk-17-jdk-headless
          pip install --upgrade pip
          pip install cython buildozer

      - name: Build with Buildozer
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
